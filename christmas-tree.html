<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#dff3f8">
  <meta name="description" content="A gentle, picture-first 3D Christmas tree decorating game for young children.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🎄%3C/text%3E%3C/svg%3E">
  <title>Lara's Christmas Tree</title>
  <style>
    :root {
      color-scheme: light;
      --ink: oklch(36% 0.065 225);
      --sky: oklch(94% 0.035 220);
      --panel: oklch(99% 0.008 220 / 0.96);
      --line: oklch(85% 0.035 220);
      --pink: oklch(67% 0.19 5);
      --pink-dark: oklch(53% 0.17 5);
      --gold: oklch(82% 0.16 85);
      --focus: oklch(57% 0.17 235);
      --shadow: 0 5px 0 oklch(65% 0.055 220 / 0.2), 0 10px 25px oklch(45% 0.055 230 / 0.12);
      --z-canvas: 0;
      --z-toolbar: 10;
      --z-dock: 20;
      --z-drag: 40; /* Retained in the z-index scale for live drag feedback. */
      --z-toast: 50;
      --z-loading: 60;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #cfeaf5 0%, #eaf7fa 57%, #f8fcfd 100%);
      transition: background 500ms ease-out;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }
    button { touch-action: manipulation; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { display: block; width: 100%; height: 100%; overflow: visible; }

    #game { position: fixed; inset: 0; isolation: isolate; }
    #scene {
      position: absolute; inset: 0; z-index: var(--z-canvas);
      width: 100%; height: 100%;
      touch-action: none; cursor: grab; display: block;
    }
    body.home-mode { background: linear-gradient(180deg, #d9c3b4 0%, #f1dfd0 58%, #b98059 100%); }
    #scene:active { cursor: grabbing; }
    body.move-mode #scene { cursor: move; }
    body.move-mode #scene:active { cursor: grabbing; }

    .edit-tools {
      position: absolute; z-index: var(--z-toolbar);
      top: max(94px, calc(env(safe-area-inset-top) + 82px));
      left: max(12px, env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    .tool-button {
      pointer-events: auto; width: 64px; height: 66px; padding: 7px 6px 5px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      border: 2px solid oklch(100% 0 0 / .9); border-radius: 21px;
      color: var(--ink); background: var(--panel); box-shadow: var(--shadow);
      cursor: pointer; transition: transform 160ms ease-out, background 160ms ease-out, box-shadow 160ms ease-out, opacity 160ms ease-out;
    }
    .tool-button .icon { width: 37px; height: 37px; flex: 0 0 37px; }
    .tool-button span { font-size: 11px; line-height: 14px; font-weight: 800; }
    .tool-button:hover:not(:disabled) { transform: translateY(-2px); }
    .tool-button:active:not(:disabled) { transform: translateY(2px); }
    .tool-button[aria-pressed="true"] {
      color: oklch(39% 0.12 239); background: oklch(91% 0.065 229);
      border-color: oklch(72% 0.12 231);
      box-shadow: 0 4px 0 oklch(64% 0.1 232 / .32), 0 0 0 3px oklch(100% 0 0 / .75);
    }
    .tool-button.trash-tool { color: oklch(51% 0.19 19); background: oklch(96% 0.025 20); }
    .tool-button.trash-tool:not(:disabled) {
      background: oklch(93% 0.06 20); border-color: oklch(79% 0.12 22);
      box-shadow: 0 4px 0 oklch(63% 0.12 20 / .24), 0 0 22px oklch(80% 0.12 20 / .34);
    }
    .tool-button:disabled { opacity: .42; cursor: default; box-shadow: 0 3px 0 oklch(65% 0.055 220 / .12); }

    .top-actions {
      position: absolute;
      z-index: var(--z-toolbar);
      top: max(12px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      width: min(calc(100% - 16px), 520px);
      display: grid; grid-template-columns: repeat(6, 1fr);
      gap: clamp(7px, 2vw, 12px);
      pointer-events: none;
    }
    .round-button {
      position: relative; pointer-events: auto;
      width: 100%; max-width: 66px; aspect-ratio: 1;
      justify-self: center; align-items: center; justify-content: center;
      display: flex; padding: 12px;
      border: 2px solid oklch(100% 0 0 / 0.82); border-radius: 22px;
      color: var(--ink); background: var(--panel);
      box-shadow: var(--shadow);
      cursor: pointer; transition: transform 160ms ease-out, background 160ms ease-out, box-shadow 160ms ease-out;
    }
    .round-button:hover { transform: translateY(-2px); }
    .round-button:active { transform: translateY(3px); box-shadow: 0 2px 0 oklch(65% 0.055 220 / 0.2); }
    .round-button[aria-pressed="true"] { background: oklch(93% 0.055 90); }
    .round-button.home-action { color: oklch(55% 0.115 35); background: oklch(95% 0.035 60); }
    .round-button.home-action[aria-pressed="true"] { background: oklch(88% 0.09 65); box-shadow: 0 5px 0 oklch(66% 0.08 45 / .3), 0 0 24px oklch(82% 0.13 65 / .55); }
    .round-button.star-action {
      color: oklch(77% 0.17 82);
      background: oklch(96% 0.065 92);
      border-color: oklch(88% 0.12 88);
    }
    .round-button.star-action[aria-pressed="true"] {
      background: oklch(88% 0.15 88);
      box-shadow: 0 5px 0 oklch(71% 0.13 75 / 0.35), 0 0 24px oklch(86% 0.16 85 / 0.7);
    }
    .round-button.listening { background: oklch(83% 0.14 12); animation: listen 900ms ease-in-out infinite alternate; }
    .round-button:disabled { opacity: .6; cursor: wait; }
    @keyframes listen { to { transform: scale(1.07); } }

    .dock {
      position: absolute; z-index: var(--z-dock);
      left: 0; right: 0; bottom: 0;
      padding: 12px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: var(--panel);
      border-top: 2px solid oklch(100% 0 0 / .95);
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -8px 32px oklch(42% 0.045 225 / .12);
    }
    .magic-row {
      display: flex; gap: 9px; width: min(100%, 620px); margin: 0 auto 11px;
    }
    .magic-row .round-button {
      width: 54px; min-width: 54px; height: 54px; padding: 12px; border-radius: 18px;
      box-shadow: 0 3px 0 oklch(67% 0.05 225 / .2);
    }
    .magic-button { color: oklch(64% 0.19 310); background: oklch(94% 0.045 305); }
    .magic-button.working .icon { animation: magic-spin 600ms ease-in-out infinite; }
    @keyframes magic-spin { 50% { transform: rotate(25deg) scale(1.2); } }
    .describe-wrap {
      min-width: 0; flex: 1; height: 54px; position: relative;
      display: flex; align-items: center;
    }
    .describe-wrap .spark {
      position: absolute; left: 15px; width: 25px; height: 25px; pointer-events: none;
      color: oklch(62% 0.12 250);
    }
    #describe {
      width: 100%; height: 100%; min-width: 0;
      border: 3px solid oklch(85% 0.05 235); border-radius: 18px;
      background: oklch(98% 0.015 225); color: var(--ink);
      padding: 0 13px 0 47px; font-size: 18px; font-weight: 650;
      -webkit-user-select: text; user-select: text;
    }
    #describe::placeholder { color: oklch(43% 0.055 230); opacity: 1; }

    .color-row {
      display: flex; align-items: center; justify-content: center;
      gap: clamp(8px, 2.4vw, 15px); min-height: 44px; margin-bottom: 10px;
      overflow-x: auto; scrollbar-width: none; padding: 2px 4px 5px;
    }
    .color-row::-webkit-scrollbar, .tray::-webkit-scrollbar { display: none; }
    .palette-mark { width: 25px; height: 25px; flex: 0 0 25px; color: oklch(52% 0.09 240); }
    .color-dot {
      position: relative; flex: 0 0 42px; width: 42px; height: 42px;
      padding: 0; border-radius: 50%; border: 3px solid oklch(100% 0 0);
      background: var(--dot); box-shadow: 0 0 0 2px oklch(82% 0.035 225), 0 3px 5px oklch(40% 0.05 225 / .16);
      cursor: pointer; transition: transform 160ms ease-out, box-shadow 160ms ease-out;
    }
    .color-dot[data-color="#fff8ed"] { box-shadow: 0 0 0 2px oklch(70% 0.045 225), 0 3px 5px oklch(40% 0.05 225 / .16); }
    .color-dot[aria-pressed="true"] { transform: scale(1.15); box-shadow: 0 0 0 4px var(--ink); }
    .color-dot[aria-pressed="true"]::after {
      content: ""; position: absolute; inset: 9px; border-radius: 50%;
      border: 3px solid white; filter: drop-shadow(0 1px 1px #315462);
    }

    .tray {
      display: flex; align-items: flex-end; gap: 10px;
      width: min(100%, 720px); margin: 0 auto;
      overflow-x: auto; overscroll-behavior-x: contain;
      padding: 5px 4px 3px; scrollbar-width: none;
      scroll-padding-inline: 4px;
    }
    .ornament-option {
      --ornament-color: #ef4f68;
      position: relative; flex: 0 0 70px; width: 70px; height: 78px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 3px solid oklch(86% 0.032 225); border-radius: 22px;
      background: oklch(96% 0.022 220); color: var(--ornament-color);
      padding: 7px 10px 9px; cursor: grab;
      touch-action: pan-x; transition: transform 170ms ease-out, border-color 170ms ease-out, background 170ms ease-out;
    }
    .ornament-option .icon { width: 49px; height: 49px; filter: drop-shadow(0 3px 1px oklch(35% 0.03 240 / .15)); }
    .ornament-option::after {
      content: ""; width: 28px; height: 4px; border-radius: 4px;
      background: var(--ornament-color); opacity: .35; margin-top: 3px;
    }
    .ornament-option[aria-pressed="true"] {
      transform: translateY(-4px);
      border-color: oklch(60% 0.14 242); background: oklch(92% 0.055 225);
      box-shadow: 0 5px 0 oklch(77% 0.09 228 / .45);
    }
    .ornament-option:active { cursor: grabbing; }
    .ornament-option.custom {
      background: oklch(95% 0.045 305); border-color: oklch(80% 0.1 310);
    }
    .custom-badge {
      position: absolute; top: -9px; right: -5px; width: 27px; height: 27px;
      padding: 4px; border-radius: 50%; color: white; background: oklch(62% 0.2 310);
      border: 2px solid white;
    }

    /* Dragging uses a translucent Three.js model in the scene, never a DOM ghost. */
    #toast {
      position: absolute; z-index: var(--z-toast);
      left: 50%; bottom: calc(232px + env(safe-area-inset-bottom));
      transform: translate(-50%, 10px) scale(.9);
      pointer-events: none; opacity: 0;
      min-width: 76px; padding: 10px 16px; border-radius: 24px;
      background: oklch(99% 0.008 220 / .96); border: 2px solid white;
      box-shadow: var(--shadow); font-size: 29px; text-align: center;
      transition: opacity 180ms ease-out, transform 180ms ease-out;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    #loading {
      position: absolute; inset: 0; z-index: var(--z-loading);
      display: grid; place-items: center; background: #dff3f8;
      transition: opacity 350ms ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .loading-tree { font-size: 72px; animation: loading-pulse 850ms ease-in-out infinite alternate; }
    @keyframes loading-pulse { to { transform: scale(1.09) rotate(3deg); } }

    @media (max-width: 430px) {
      .palette-mark { display: none; }
      .color-row { gap: clamp(8px, 2.7vw, 12px); }
    }
    @media (min-width: 700px) {
      .dock { left: 50%; right: auto; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); bottom: 14px; border-radius: 28px; border: 2px solid white; }
      #toast { bottom: 250px; }
    }
    @media (max-height: 650px) {
      .top-actions { top: max(7px, env(safe-area-inset-top)); width: min(calc(100% - 12px), 420px); }
      .edit-tools { top: max(75px, calc(env(safe-area-inset-top) + 68px)); gap: 8px; left: max(8px, env(safe-area-inset-left)); }
      .tool-button { width: 52px; height: 54px; padding: 4px; border-radius: 17px; }
      .tool-button .icon { width: 31px; height: 31px; flex-basis: 31px; }
      .tool-button span { font-size: 9px; line-height: 11px; }
      .round-button { max-width: 52px; padding: 10px; border-radius: 17px; }
      .dock { padding-top: 7px; border-radius: 20px 20px 0 0; }
      .magic-row { margin-bottom: 5px; gap: 7px; }
      .magic-row .round-button, .describe-wrap { width: 46px; min-width: 46px; height: 46px; }
      .describe-wrap { flex: 1; }
      .color-row { min-height: 34px; margin-bottom: 3px; gap: 9px; padding-bottom: 2px; }
      .color-dot { flex-basis: 40px; width: 40px; height: 40px; }
      .color-dot[aria-pressed="true"]::after { inset: 8px; }
      .palette-mark { width: 21px; height: 21px; flex-basis: 21px; }
      .ornament-option { flex-basis: 58px; width: 58px; height: 60px; border-radius: 17px; padding: 4px 7px; }
      .ornament-option .icon { width: 40px; height: 40px; }
      .ornament-option::after { margin-top: 0; }
      .tray { padding-top: 3px; }
      #toast { bottom: 174px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .edit-tools { top: max(69px, calc(env(safe-area-inset-top) + 62px)); gap: 6px; }
      .tool-button { width: 48px; height: 48px; border-radius: 15px; }
      .tool-button .icon { width: 29px; height: 29px; flex-basis: 29px; }
      .tool-button span { display: none; }
      .dock {
        left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom));
        width: auto; transform: none; display: grid;
        grid-template-columns: minmax(180px, 1fr) auto; grid-template-rows: 46px 62px;
        gap: 4px 10px; padding: 6px 10px; border: 2px solid white; border-radius: 22px;
      }
      .magic-row { grid-column: 1; grid-row: 1; width: 100%; margin: 0; }
      .color-row { grid-column: 2; grid-row: 1; margin: 0; min-height: 42px; padding: 3px 0; gap: 7px; }
      .color-dot { flex-basis: 34px; width: 34px; height: 34px; }
      .tray { grid-column: 1 / -1; grid-row: 2; justify-content: center; width: 100%; padding: 1px 0; }
      #toast { bottom: 150px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>

  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Small, picture-friendly interface helpers ----------
    const $ = (id) => document.getElementById(id);
    const canvas = $('scene');
    const tray = $('tray');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = THREE.MathUtils.clamp;
    let toastTimer;

    function toast(pictures, accessibleMessage) {
      const el = $('toast');
      clearTimeout(toastTimer);
      el.textContent = pictures;
      el.setAttribute('aria-label', accessibleMessage);
      el.classList.add('show');

    }

    function tinyTap() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    const iconForShape = (shape) => ({
      bauble: 'bauble', star: 'star', candy: 'candy', heart: 'heart',
      snowflake: 'snowflake', gift: 'gift', bell: 'bell',
      unicorn: 'unicorn', dinosaur: 'dinosaur'
    }[shape] || 'magic');

    // ---------- Local magic-ornament generator (safe to replace later) ----------
    async function generateOrnament(description) {
      const words = String(description || '').toLowerCase().trim();
      const has = (...names) => names.some((name) => new RegExp(`\\b${name}s?\\b`, 'i').test(words));
      const colors = [
        [['pink', 'rose'], '#ff75b5'], [['blue', 'azure'], '#5aa9ef'],
        [['red', 'ruby'], '#ef4f68'], [['purple', 'violet', 'lilac'], '#a77bed'],
        [['green', 'emerald'], '#50bd88'], [['yellow', 'gold', 'golden'], '#ffd34e'],
        [['orange'], '#ff9850'], [['white', 'snow', 'snowy'], '#fff8ed'],
        [['black'], '#3d4653'], [['turquoise', 'teal', 'aqua'], '#42c8c4']
      ];
      let color = '#ef4f68';
      for (const [names, hex] of colors) if (has(...names)) { color = hex; break; }
      let shape = 'bauble';
      if (has('unicorn')) shape = 'unicorn';
      else if (has('dinosaur', 'dino', 'dragon')) shape = 'dinosaur';
      else if (has('star')) shape = 'star';
      else if (has('heart', 'love')) shape = 'heart';
      else if (has('snowflake')) shape = 'snowflake';
      else if (has('candy', 'cane')) shape = 'candy';
      else if (has('gift', 'present')) shape = 'gift';
      else if (has('bell', 'jingle')) shape = 'bell';
      else if (has('ball', 'bauble', 'ornament', 'circle', 'round')) shape = 'bauble';
      const size = has('big', 'huge', 'giant') ? 1.3 : has('little', 'small', 'tiny') ? 0.76 : 1;
      let pattern = has('stripe', 'striped', 'stripy') ? 'stripes'
        : has('dot', 'dots', 'spot', 'spots', 'spotted', 'polka') ? 'dots'
        : has('sparkle', 'sparkly', 'glitter', 'glittery', 'shiny') ? 'sparkles' : 'plain';
      if (has('rainbow')) { color = '#ff75b5'; pattern = 'rainbow'; }
      await new Promise((resolve) => setTimeout(resolve, reducedMotion ? 0 : 220));
      // REAL_LLM_API_CALL: Replace only the next line with a fetch to your secure server-side LLM proxy returning { shape, color, size, pattern }.
      return { shape, color, size, pattern };
    }
    window.generateOrnament = generateOrnament;

    const ornamentTypes = new Map([
      ['bauble', { shape: 'bauble', color: '#ef4f68', size: 1, pattern: 'plain' }],
      ['star', { shape: 'star', color: '#ffd34e', size: 1, pattern: 'plain' }],
      ['candy', { shape: 'candy', color: '#ef4f68', size: 1, pattern: 'plain' }],
      ['heart', { shape: 'heart', color: '#ff75b5', size: 1, pattern: 'plain' }],
      ['snowflake', { shape: 'snowflake', color: '#5aa9ef', size: 1, pattern: 'plain' }],
      ['gift', { shape: 'gift', color: '#a77bed', size: 1, pattern: 'plain' }],
      ['bell', { shape: 'bell', color: '#ffd34e', size: 1, pattern: 'plain' }]
    ]);
    let selectedId = 'bauble';
    let magicCount = 0;

    function svgUse(shape, extraClass = '') {
      return `<svg class="icon ${extraClass}" aria-hidden="true"><use href="#i-${iconForShape(shape)}"/></svg>`;
    }

    function addTrayButton(id, spec, custom = false) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `ornament-option${custom ? ' custom' : ''}`;
      button.dataset.id = id;
      button.style.setProperty('--ornament-color', spec.color);
      button.setAttribute('aria-label', `${custom ? 'Magic ' : ''}${spec.shape} ornament`);
      button.setAttribute('aria-pressed', String(id === selectedId));
      button.title = `${spec.shape}: tap to choose or drag to the tree`;
      button.innerHTML = svgUse(spec.shape) + (custom ? svgUse('star', 'custom-badge') : '');
      button.addEventListener('click', () => {
        if (suppressTrayClick) return;
        selectOrnament(id);
      });
      button.addEventListener('pointerdown', beginTrayDrag);
      tray.appendChild(button);
      return button;
    }

    ornamentTypes.forEach((spec, id) => addTrayButton(id, spec));

    function selectOrnament(id) {
      selectedId = id;
      document.querySelectorAll('.ornament-option').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.id === id));
      });
      const selectedColor = ornamentTypes.get(id).color;
      document.querySelectorAll('.color-dot').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.color.toLowerCase() === selectedColor.toLowerCase()));
      });
      lastInteraction = performance.now();
    }

    $('color-row').addEventListener('click', (event) => {
      const dot = event.target.closest('.color-dot');
      if (!dot) return;
      const spec = ornamentTypes.get(selectedId);
      spec.color = dot.dataset.color;
      const button = tray.querySelector(`[data-id="${selectedId}"]`);
      button.style.setProperty('--ornament-color', spec.color);
      selectOrnament(selectedId);
      toast('🎨✨', `${dot.getAttribute('aria-label')} selected`);
      tinyTap();
    });

    async function makeMagicOrnament() {
      const button = $('magic-button');
      if (button.disabled) return;
      button.disabled = true;
      button.classList.add('working');
      try {
        const spec = await generateOrnament($('describe').value);
        const id = `magic-${++magicCount}`;
        ornamentTypes.set(id, spec);
        const option = addTrayButton(id, spec, true);
        selectOrnament(id);
        option.scrollIntoView({ behavior: reducedMotion ? 'instant' : 'smooth', inline: 'end', block: 'nearest' });
        toast('🪄✨', 'Your magic ornament is ready');
        $('describe').value = '';
        tinyTap();
      } finally {
        button.disabled = false;
        button.classList.remove('working');
      }
    }
    $('magic-button').addEventListener('click', makeMagicOrnament);
    $('describe').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); makeMagicOrnament(); $('describe').blur(); }
    });

    // Speech is an optional shortcut. The large type box always remains available.
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;
    function stopMicPictures() {
      listening = false;
      $('mic-button').classList.remove('listening');
      $('mic-button').setAttribute('aria-pressed', 'false');
    }
    $('mic-button').addEventListener('click', () => {
      if (!SpeechRecognition) {
        $('describe').focus();
        toast('☝️⌨️', 'Type your ornament in the box');
        return;
      }
      if (listening) { recognition?.stop(); stopMicPictures(); return; }
      recognition = new SpeechRecognition();
      recognition.lang = navigator.language || 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = (event) => {
        $('describe').value = event.results[0][0].transcript;
        toast('👂✨', 'I heard your ornament. Tap the magic wand.');
      };
      recognition.onerror = () => {
        stopMicPictures();
        $('describe').focus();
        toast('☝️⌨️', 'You can type your ornament instead');
      };
      recognition.onend = stopMicPictures;
      try {
        recognition.start();
        listening = true;
        $('mic-button').classList.add('listening');
        $('mic-button').setAttribute('aria-pressed', 'true');
      } catch {
        stopMicPictures();
        $('describe').focus();
      }
    });

    // ---------- Three.js winter world ----------
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setClearColor(0xdff3f8, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.03;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    let renderNeeded = true;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xdff3f8, 15, 30);
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
    scene.add(new THREE.HemisphereLight(0xe5f3f7, 0x657c68, 1.35));
    const keyLight = new THREE.DirectionalLight(0xfff1dc, 2.65);
    keyLight.position.set(-5, 9, 7);
    keyLight.castShadow = true;
    const shadowSize = innerWidth < 600 ? 1024 : 2048;
    keyLight.shadow.mapSize.set(shadowSize, shadowSize);
    Object.assign(keyLight.shadow.camera, { left: -6, right: 6, top: 8, bottom: -4, near: 0.5, far: 25 });
    keyLight.shadow.bias = -0.00025;
    keyLight.shadow.normalBias = 0.025;
    keyLight.shadow.radius = 4;
    keyLight.shadow.camera.updateProjectionMatrix();
    keyLight.target.position.set(0, 2.6, 0);
    scene.add(keyLight, keyLight.target);
    const fillLight = new THREE.DirectionalLight(0xb9d8ee, 0.72);
    fillLight.position.set(6, 4, -4);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffe3bd, 0.8);
    rimLight.position.set(-2, 5, -7);
    scene.add(rimLight);

    // Six procedural reflection faces give metal and lacquer something real to reflect.
    const reflectionFaces = Array.from({ length: 6 }, (_, face) => {
      const picture = document.createElement('canvas'); picture.width = picture.height = 128;
      const context = picture.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 0, 128);
      gradient.addColorStop(0, face === 2 ? '#f7e9cf' : '#aec9d2');
      gradient.addColorStop(0.55, '#6f8586'); gradient.addColorStop(1, '#273f3b');
      context.fillStyle = gradient; context.fillRect(0, 0, 128, 128);
      if (face === 0 || face === 4) {
        context.fillStyle = 'rgba(255,246,220,.9)'; context.fillRect(20, 16, 58, 76);
        context.fillStyle = 'rgba(255,255,255,.55)'; context.fillRect(25, 20, 3, 68);
      }
      return picture;
    });
    const reflectionCube = new THREE.CubeTexture(reflectionFaces);
    reflectionCube.colorSpace = THREE.SRGBColorSpace; reflectionCube.needsUpdate = true;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const reflectionTarget = pmrem.fromCubemap(reflectionCube);
    scene.environment = reflectionTarget.texture;
    reflectionCube.dispose(); pmrem.dispose();

    const world = new THREE.Group();
    scene.add(world);
    const treeTurn = new THREE.Group();
    const treeWobble = new THREE.Group();
    const treeModel = new THREE.Group();
    treeTurn.add(treeWobble);
    treeWobble.add(treeModel);
    world.add(treeTurn);
    treeTurn.rotation.y = -0.18;

    const treeMeshes = [];
    const tierSpecs = [
      { radius: 2.02, height: 2.25, y: 2.275, color: 0x235c3d },
      { radius: 1.60, height: 2.60, y: 3.40, color: 0x286746 },
      { radius: 1.18, height: 2.30, y: 4.47, color: 0x2e714b }
    ];

    function enableShadows(object, receive = true) {
      object.traverse((child) => {
        if (!child.isMesh) return;
        child.castShadow = true; child.receiveShadow = receive;
      });
      return object;
    }

    const potMat = new THREE.MeshPhysicalMaterial({ color: 0xa93f47, roughness: 0.34, metalness: 0, clearcoat: 0.7, clearcoatRoughness: 0.22, envMapIntensity: 0.8 });
    const potProfile = [[0.50, 0.05], [0.56, 0.09], [0.60, 0.22], [0.69, 0.55], [0.71, 0.62], [0.69, 0.68], [0.60, 0.68], [0.59, 0.59]].map(([x, y]) => new THREE.Vector2(x, y));
    const pot = new THREE.Mesh(new THREE.LatheGeometry(potProfile, 48), potMat);
    treeModel.add(enableShadows(pot));
    const potRim = new THREE.Mesh(new THREE.TorusGeometry(0.655, 0.065, 14, 48), new THREE.MeshPhysicalMaterial({ color: 0xc55b5e, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.18 }));
    potRim.rotation.x = Math.PI / 2; potRim.position.y = 0.64;
    treeModel.add(enableShadows(potRim));
    const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.585, 0.585, 0.035, 40), new THREE.MeshStandardMaterial({ color: 0x2d2119, roughness: 1 }));
    soil.position.y = 0.615; treeModel.add(enableShadows(soil));
    const barkPicture = document.createElement('canvas'); barkPicture.width = 128; barkPicture.height = 256;
    const barkContext = barkPicture.getContext('2d');
    barkContext.fillStyle = '#806047'; barkContext.fillRect(0, 0, 128, 256);
    for (let i = 0; i < 90; i++) {
      const x = (i * 47) % 128, y = (i * 83) % 256;
      barkContext.strokeStyle = i % 2 ? 'rgba(44,25,16,.3)' : 'rgba(225,189,143,.2)';
      barkContext.lineWidth = 1 + i % 3; barkContext.beginPath(); barkContext.moveTo(x, y);
      barkContext.bezierCurveTo(x - 4, y + 18, x + 5, y + 35, x - 1, y + 56); barkContext.stroke();
    }

        if (effect.age >= 0.72) {
          scene.remove(effect.group);
          effect.particles.forEach(({ sprite }) => sprite.material.dispose());
          sparkleEffects.splice(i, 1); renderNeeded = true;
        }
      }

      if (!reducedMotion) {
        const positions = snowGeometry.attributes.position.array;
        if (snow.visible) {
          for (let i = 0; i < snowCount; i++) {
            positions[i * 3 + 1] -= snowSpeeds[i] * delta;
            positions[i * 3] += Math.sin(now * 0.00035 + i) * delta * 0.07;
            if (positions[i * 3 + 1] < 0) { positions[i * 3 + 1] = 10; positions[i * 3] = (Math.random() - 0.5) * 17; }
          }
          snowGeometry.attributes.position.needsUpdate = true;
        }
        if (windowSnow.visible) {
          const insideFlakes = windowSnowGeometry.attributes.position.array;
          for (let i = 0; i < windowSnowCount; i++) {
            insideFlakes[i * 3 + 1] -= windowSnowSpeeds[i] * delta;
            insideFlakes[i * 3] += Math.sin(now * 0.001 + i * 2) * delta * 0.035;
            if (insideFlakes[i * 3 + 1] < -1.28) {
              insideFlakes[i * 3 + 1] = 1.28;
              insideFlakes[i * 3] = (Math.random() - 0.5) * 2.04;
            }
            insideFlakes[i * 3] = clamp(insideFlakes[i * 3], -1.02, 1.02);
          }
          windowSnowGeometry.attributes.position.needsUpdate = true;
        }
        bulbs.forEach(({ bulb, glow, phase }) => {
          const twinkle = 0.72 + Math.sin(now * 0.0023 + phase) * 0.24;
          bulb.scale.setScalar(0.85 + twinkle * 0.22);
          glow.material.opacity = twinkle * 0.63;
          glow.scale.setScalar(0.24 + twinkle * 0.15);
        });
        topStarGlow.material.opacity = 0.38 + Math.sin(now * 0.002) * 0.07;
        if (homeMode) {
          flames.forEach((flame) => {
            const baseScale = flame.userData.baseScale;
            const flicker = 0.93 + Math.sin(now * 0.009 + flame.userData.phase) * 0.10 + Math.sin(now * 0.017 + flame.userData.phase) * 0.04;
            flame.scale.set(baseScale.x * (1.04 - flicker * 0.08), baseScale.y * flicker, baseScale.z);
          });
          fireGlow.material.opacity = 0.57 + Math.sin(now * 0.008) * 0.10;
          fireLight.intensity = 7.5 + Math.sin(now * 0.011) * 1.3 + Math.sin(now * 0.019) * 0.6;
        }
      }

      shakeElapsed += delta;
      if (shakeElapsed < 1.65) {
        const fade = 1 - shakeElapsed / 1.65;
        treeWobble.rotation.z = Math.sin(shakeElapsed * 24) * 0.10 * fade;
        treeWobble.rotation.x = Math.sin(shakeElapsed * 19) * 0.035 * fade;
        placedOrnaments.forEach((ornament) => {
          const wiggle = Math.sin(shakeElapsed * 31 + ornament.userData.phase) * 0.18 * fade;
          ornament.quaternion.copy(ornament.userData.baseQuaternion).multiply(new THREE.Quaternion().setFromAxisAngle(zAxis, wiggle));
        });
        topStar.rotation.z = Math.sin(shakeElapsed * 27) * 0.16 * fade;
      } else {
        treeWobble.rotation.z = THREE.MathUtils.damp(treeWobble.rotation.z, 0, 12, delta);
        treeWobble.rotation.x = THREE.MathUtils.damp(treeWobble.rotation.x, 0, 12, delta);
        placedOrnaments.forEach((ornament) => ornament.quaternion.copy(ornament.userData.baseQuaternion));
        topStar.rotation.z = THREE.MathUtils.damp(topStar.rotation.z, 0, 12, delta);
      }

      const growingOrnaments = placedOrnaments.some((ornament) => ornament.userData.bornAt);
      const staticReducedFrame = reducedMotion && !firstFrame && !renderNeeded && !pointers.size && !trayDrag &&
        shakeElapsed >= 1.65 && !topStar.userData.shownAt && !growingOrnaments && sparkleEffects.length === 0;
      if (!staticReducedFrame) {
        if (firstFrame || (idle && !reducedMotion && now - lastShadowUpdate > 700) || pointers.size || trayDrag || shakeElapsed < 1.65 ||
            Math.abs(rotationVelocity) > 0.001 || topStar.userData.shownAt || growingOrnaments) {
          renderer.shadowMap.needsUpdate = true; lastShadowUpdate = now;
        }
        renderer.render(scene, camera);
        renderNeeded = false;
      }
      if (firstFrame) {
        firstFrame = false;
        $('loading').classList.add('done');
        setTimeout(() => $('loading').remove(), 450);
        document.body.dataset.ready = 'true';
      }
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
